<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"theme","type":"string","default":"light","label":"Theme"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=900" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: #f7f4fb;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          Arial, sans-serif;
      }

      :root {
        --bg: #f7f4fb;
        --bg-radial: rgba(117, 91, 209, 0.1);
        --wordmark: #101329;
        --tagline: rgba(24, 27, 48, 0.67);
        --soft-line: rgba(92, 80, 144, 0.16);
        --panel-rear: rgba(212, 204, 255, 0.86);
        --panel-rear-edge: rgba(248, 245, 255, 0.72);
        --panel-front-top: #5651f0;
        --panel-front-bottom: #262198;
        --panel-glint: rgba(255, 255, 255, 0.45);
        --panel-shadow: rgba(54, 45, 117, 0.24);
        --panel-shadow-strong: rgba(34, 29, 95, 0.32);
      }

      :root[data-theme="dark"] {
        --bg: #10111b;
        --bg-radial: rgba(142, 123, 255, 0.18);
        --wordmark: #f3efff;
        --tagline: rgba(229, 223, 248, 0.72);
        --soft-line: rgba(213, 204, 255, 0.14);
        --panel-rear: rgba(177, 165, 255, 0.74);
        --panel-rear-edge: rgba(229, 221, 255, 0.28);
        --panel-front-top: #6f68ff;
        --panel-front-bottom: #3932c1;
        --panel-glint: rgba(255, 255, 255, 0.32);
        --panel-shadow: rgba(0, 0, 0, 0.42);
        --panel-shadow-strong: rgba(0, 0, 0, 0.5);
      }

      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }

      #root {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        color: var(--wordmark);
        background:
          radial-gradient(
            circle at 78% 44%,
            var(--bg-radial) 0,
            rgba(255, 255, 255, 0) 360px
          ),
          linear-gradient(180deg, var(--bg), var(--bg));
      }

      .ambient-line {
        position: absolute;
        left: 120px;
        right: 120px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--soft-line),
          transparent
        );
        opacity: 0.68;
      }

      .ambient-line.top {
        top: 132px;
      }

      .ambient-line.bottom {
        bottom: 126px;
      }

      .identity {
        position: absolute;
        left: 166px;
        top: 361px;
        width: 710px;
        height: 182px;
      }

      .brand-row {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 28px;
        height: 112px;
      }

      .mark-shell {
        width: 92px;
        height: 92px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        opacity: 0;
        filter: drop-shadow(0 18px 28px rgba(62, 52, 136, 0.14));
      }

      .mark-shell img {
        width: 92px;
        height: 92px;
        display: block;
      }

      .wordmark {
        font-size: 106px;
        line-height: 0.96;
        font-weight: 760;
        letter-spacing: 0;
        color: var(--wordmark);
        opacity: 0;
        white-space: nowrap;
      }

      .tagline {
        position: absolute;
        left: 122px;
        top: 128px;
        width: 600px;
        font-size: 33px;
        line-height: 1.28;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--tagline);
        opacity: 0;
        white-space: nowrap;
      }

      .panels {
        position: absolute;
        left: 908px;
        top: 146px;
        width: 560px;
        height: 610px;
      }

      .panel {
        position: absolute;
        border-radius: 54px;
        overflow: hidden;
        opacity: 0;
        will-change: transform, opacity, filter;
      }

      .panel.rear {
        left: 18px;
        top: 55px;
        width: 310px;
        height: 520px;
        background:
          linear-gradient(135deg, var(--panel-rear-edge), transparent 42%),
          linear-gradient(180deg, var(--panel-rear), rgba(196, 184, 255, 0.62));
        border: 1px solid rgba(255, 255, 255, 0.42);
        box-shadow:
          0 44px 86px var(--panel-shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.62);
      }

      .panel.front {
        left: 198px;
        top: 0;
        width: 348px;
        height: 610px;
        background:
          linear-gradient(132deg, var(--panel-glint), transparent 26%),
          linear-gradient(180deg, var(--panel-front-top), var(--panel-front-bottom));
        box-shadow:
          0 52px 110px var(--panel-shadow-strong),
          inset 0 1px 0 rgba(255, 255, 255, 0.38),
          inset 0 -1px 0 rgba(20, 16, 82, 0.32);
      }

      .front .inner-edge,
      .rear .inner-edge {
        position: absolute;
        top: 34px;
        bottom: 34px;
        width: 1px;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.34);
      }

      .front .inner-edge {
        left: 38px;
      }

      .rear .inner-edge {
        right: 40px;
        opacity: 0.5;
      }

      .front .surface {
        position: absolute;
        left: 56px;
        right: 46px;
        top: 76px;
        height: 1px;
        background: rgba(255, 255, 255, 0.24);
      }

      .front .surface.two {
        top: 510px;
        opacity: 0.16;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1600"
      data-height="900"
    >
      <section
        id="easyflow-hero"
        class="clip hero"
        data-start="0"
        data-duration="7"
        data-track-index="0"
        aria-label="EasyFlow animated README hero"
      >
        <div class="ambient-line top"></div>
        <div class="ambient-line bottom"></div>

        <div class="identity" aria-hidden="true">
          <div class="brand-row">
            <div class="mark-shell">
              <img src="assets/brand/easyflow-mark.png" alt="" />
            </div>
            <div class="wordmark">EasyFlow</div>
          </div>
          <div class="tagline">Your current work, one movement away.</div>
        </div>

        <div class="panels" aria-hidden="true">
          <div class="panel rear">
            <div class="inner-edge"></div>
          </div>
          <div class="panel front">
            <div class="inner-edge"></div>
            <div class="surface"></div>
            <div class="surface two"></div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const variables = window.__hyperframes?.getVariables?.() || {};
      document.documentElement.dataset.theme =
        variables.theme === "dark" ? "dark" : "light";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({
        paused: true,
        defaults: { overwrite: "auto" },
      });

      tl.fromTo(
        ".wordmark",
        { x: -180, opacity: 0, filter: "blur(10px)" },
        {
          x: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 1.18,
          ease: "expo.out",
        },
        0.42
      );

      tl.fromTo(
        ".mark-shell",
        { x: -44, scale: 0.97, opacity: 0, filter: "blur(7px)" },
        {
          x: 0,
          scale: 1,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.78,
          ease: "power3.out",
        },
        0.76
      );

      tl.fromTo(
        ".panel.rear",
        { x: 470, y: 18, opacity: 0, filter: "blur(8px)" },
        {
          x: 0,
          y: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 1.85,
          ease: "expo.out",
        },
        1.16
      );

      tl.fromTo(
        ".panel.front",
        { x: 560, y: 30, opacity: 0, filter: "blur(9px)" },
        {
          x: 0,
          y: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 1.72,
          ease: "expo.out",
        },
        1.38
      );

      tl.fromTo(
        ".tagline",
        { y: 14, opacity: 0, filter: "blur(7px)" },
        {
          y: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.82,
          ease: "power3.out",
        },
        2.58
      );

      tl.to(
        ".panel.rear",
        {
          y: -5,
          duration: 1.75,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        3.55
      );

      tl.to(
        ".panel.front",
        {
          y: 4,
          duration: 1.75,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        3.55
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
