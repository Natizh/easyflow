name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-publish:
    name: Package and publish
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Report toolchain
        run: swift --version

      - name: Verify tag matches app version
        shell: zsh {0}
        run: |
          version="$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            print -u2 -r -- "Tag $GITHUB_REF_NAME does not match app version v$version"
            exit 1
          fi

      - name: Resolve dependencies
        run: swift package resolve

      - name: Test
        run: swift test

      - name: Package release
        run: ./scripts/package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/EasyFlow.zip \
              dist/EasyFlow.zip.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/EasyFlow.zip \
              dist/EasyFlow.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "EasyFlow $GITHUB_REF_NAME" \
              --generate-notes
          fi
